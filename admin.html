<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bioSafe | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-wrap { max-width: 900px; margin: 2rem auto 4rem; padding: 0 1.5rem; }
        .page-title { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: .4rem; }
        .page-sub { color: var(--text-light); margin-bottom: 2rem; }

        /* Admin Login card */
        .admin-login-card {
            background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg); max-width: 420px; margin: 3rem auto; border: 1px solid var(--border);
        }

        /* Tabs */
        .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); }
        .tab-btn {
            padding: .8rem 1.4rem; border: none; background: none; cursor: pointer;
            font-family: inherit; font-weight: 700; color: var(--text-light);
            border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .3s;
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--secondary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeUp .4s ease; }

        .card {
            background: var(--white); border-radius: var(--radius-lg); padding: 2rem;
            box-shadow: var(--shadow-md); border: 1px solid var(--border);
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
        .form-msg { margin-top: 1rem; padding: .8rem 1rem; border-radius: var(--radius); font-weight: 600; display: none; }
        .form-msg.ok { display: block; background: #dcfce7; color: #166534; }
        .form-msg.err { display: block; background: #fee2e2; color: #991b1b; }
        .list-title { font-weight: 800; color: var(--primary); margin: 2rem 0 1rem; }
        .list-item {
            background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
            padding: .9rem 1.2rem; margin-bottom: .6rem; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: .5rem;
        }
        .list-item strong { color: var(--primary); }
        .list-item small { color: var(--text-light); }
        .logout-btn { background: var(--bg-alt); color: var(--primary); border: 1px solid var(--border); padding: .5rem 1.1rem; border-radius: 50px; font-family: inherit; font-weight: 700; cursor: pointer; font-size: .85rem; }
        .logout-btn:hover { background: #fee2e2; color: #991b1b; border-color: #fecaca; }

        /* Fingerprint scan button */
        .btn-scan {
            display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
            padding: .7rem 1.4rem; font-family: inherit; font-weight: 700; font-size: .9rem;
            color: #fff; border: none; border-radius: var(--radius); cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: all .3s;
        }
        .btn-scan:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(26,158,143,.3); }
        .btn-scan:disabled { opacity: .6; cursor: not-allowed; }
        .btn-scan.scanned { background: linear-gradient(135deg, #166534, #22c55e); }
        .scan-row { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }
        .scan-status { font-size: .82rem; color: var(--text-light); }

        /* Views */
        #adminLoginView, #adminPanelView { display: none; }
        #adminLoginView.active, #adminPanelView.active { display: block; }
        #adminPanelView.active { animation: fadeUp .4s ease; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="bioSafe home">
                <img src="Icon.png" alt="bioSafe icon"><span>BioSafe</span>
            </a>
            <nav class="nav-links">
                <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
                <a href="index.html" class="btn-login-nav"><i class="fa-solid fa-house"></i> Home</a>
            </nav>
        </div>
    </header>

    <div class="page-wrap">

        <!-- ============ ADMIN LOGIN VIEW ============ -->
        <div id="adminLoginView" class="active">
            <div class="admin-login-card">
                <div style="text-align:center;margin-bottom:1.5rem;">
                    <div style="width:70px;height:70px;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b3a5c,#2a5580);border-radius:50%;color:#fff;font-size:1.8rem;">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <h3 style="font-size:1.4rem;font-weight:800;color:var(--primary);">Admin Login</h3>
                    <p style="color:var(--text-light);font-size:.88rem;">Restricted access — administrators only</p>
                </div>
                <form id="adminLoginForm">
                    <div class="input-group">
                        <label for="admUser">Username</label>
                        <input type="text" id="admUser" required placeholder="admin" autocomplete="username">
                    </div>
                    <div class="input-group">
                        <label for="admPass">Password</label>
                        <input type="password" id="admPass" required placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Log In</button>
                    <div class="form-msg" id="adminLoginMsg"></div>
                </form>
                <p style="text-align:center;font-size:.75rem;color:var(--text-light);margin-top:1rem;">
                    Default: <code>admin / admin123</code>
                </p>
            </div>
        </div>

        <!-- ============ ADMIN PANEL VIEW ============ -->
        <div id="adminPanelView">
            <h1 class="page-title">Admin Panel</h1>
            <p class="page-sub">Register patients and doctors in the bioSafe system.</p>

            <div class="tabs">
                <button class="tab-btn active" data-tab="patient"><i class="fa-solid fa-user"></i> Register Patient</button>
                <button class="tab-btn" data-tab="doctor"><i class="fa-solid fa-user-doctor"></i> Register Doctor</button>
                <button class="tab-btn" data-tab="lists"><i class="fa-solid fa-list"></i> View Lists</button>
            </div>

            <!-- PATIENT TAB -->
            <div class="tab-panel active" id="tab-patient">
                <div class="card">
                    <h3 style="margin-bottom:1rem;color:var(--primary);">New Patient</h3>
                    <form id="patientForm">
                        <div class="grid-2">
                            <div class="input-group">
                                <label>National ID (14 digits)</label>
                                <input type="text" name="nationalId" id="pNationalId" pattern="\d{14}" maxlength="14" required placeholder="14-digit ID">
                            </div>
                            <div class="input-group">
                                <label>Password</label>
                                <input type="password" name="password" id="pPassword" minlength="6" required placeholder="Min 6 characters">
                            </div>
                            <div class="input-group">
                                <label>Full Name</label>
                                <input type="text" name="fullName" id="pFullName" required placeholder="Patient full name">
                            </div>
                            <div class="input-group">
                                <label>Email</label>
                                <input type="email" name="email" id="pEmail" placeholder="patient@email.com">
                            </div>
                            <div class="input-group">
                                <label>Phone</label>
                                <input type="text" name="phone" id="pPhone" placeholder="+20 ...">
                            </div>
                            <div class="input-group">
                                <label>Blood Type</label>
                                <select name="bloodType" id="pBloodType" style="width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;background:var(--bg);">
                                    <option value="">Select</option>
                                    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                                    <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Date of Birth</label>
                                <input type="date" name="dateOfBirth" id="pDOB">
                            </div>
                            <div class="input-group">
                                <label>Address</label>
                                <input type="text" name="address" id="pAddress" placeholder="City / area">
                            </div>
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-fingerprint"></i> Fingerprint (required)</label>
                            <div class="scan-row">
                                <button type="button" id="pScanBtn" class="btn-scan">
                                    <i class="fa-solid fa-fingerprint"></i> Scan Fingerprint
                                </button>
                                <span id="pScanStatus" class="scan-status">Not scanned</span>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> Register Patient</button>
                        <div class="form-msg" id="patientMsg"></div>
                    </form>
                </div>
            </div>

            <!-- DOCTOR TAB -->
            <div class="tab-panel" id="tab-doctor">
                <div class="card">
                    <h3 style="margin-bottom:1rem;color:var(--primary);">New Doctor</h3>
                    <form id="doctorForm">
                        <div class="grid-2">
                            <div class="input-group">
                                <label>National ID (14 digits)</label>
                                <input type="text" name="nationalId" id="dNationalId" pattern="\d{14}" maxlength="14" required placeholder="14-digit ID">
                            </div>
                            <div class="input-group">
                                <label>Password</label>
                                <input type="password" name="password" id="dPassword" minlength="6" required placeholder="Min 6 characters">
                            </div>
                            <div class="input-group">
                                <label>Full Name</label>
                                <input type="text" name="fullName" id="dFullName" required placeholder="Dr. Full Name">
                            </div>
                            <div class="input-group">
                                <label>Specialization</label>
                                <input type="text" name="specialization" id="dSpec" placeholder="e.g. Cardiology">
                            </div>
                            <div class="input-group">
                                <label>Hospital</label>
                                <input type="text" name="hospital" id="dHospital" placeholder="Hospital name">
                            </div>
                            <div class="input-group">
                                <label>Email</label>
                                <input type="email" name="email" id="dEmail" placeholder="doctor@hospital.com">
                            </div>
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-fingerprint"></i> Fingerprint (required)</label>
                            <div class="scan-row">
                                <button type="button" id="dScanBtn" class="btn-scan">
                                    <i class="fa-solid fa-fingerprint"></i> Scan Fingerprint
                                </button>
                                <span id="dScanStatus" class="scan-status">Not scanned</span>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> Register Doctor</button>
                        <div class="form-msg" id="doctorMsg"></div>
                    </form>
                </div>
            </div>

            <!-- LISTS TAB -->
            <div class="tab-panel" id="tab-lists">
                <div class="list-title">Registered Patients</div>
                <div id="patientsList"><small style="color:var(--text-light);">Loading...</small></div>
                <div class="list-title">Registered Doctors</div>
                <div id="doctorsList"><small style="color:var(--text-light);">Loading...</small></div>
            </div>
        </div>
    </div>

    <script src="biometric.js"></script>
    <script>
        const API = 'http://localhost:3000';

        /* ---------- Admin Auth ---------- */
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('adminLoginMsg');
            try {
                const res = await fetch(API + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('admUser').value.trim(),
                        password: document.getElementById('admPass').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    msg.className = 'form-msg err';
                    msg.textContent = '❌ ' + (data.error || 'Login failed');
                    return;
                }
                msg.className = 'form-msg';
                document.getElementById('adminLoginView').classList.remove('active');
                document.getElementById('adminPanelView').classList.add('active');
                document.getElementById('logoutBtn').style.display = 'inline-flex';
            } catch (err) {
                msg.className = 'form-msg err';
                msg.textContent = '❌ Server unreachable';
            }
        });

        function logout() {
            document.getElementById('adminPanelView').classList.remove('active');
            document.getElementById('adminLoginView').classList.add('active');
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('adminLoginForm').reset();
        }

        /* ---------- Tabs ---------- */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'lists') loadLists();
            });
        });

        function showMsg(el, text, ok) {
            el.textContent = text;
            el.className = 'form-msg ' + (ok ? 'ok' : 'err');
        }

        /* ---------- Fingerprint scan helpers ---------- */
        let pCredentialId = null;
        let dCredentialId = null;

        async function scanFingerprint(btnId, statusId, assignFn) {
            const btn = document.getElementById(btnId);
            const status = document.getElementById(statusId);
            btn.disabled = true;
            status.textContent = 'Scanning... place finger on sensor';
            status.style.color = 'var(--secondary)';
            try {
                const result = await BioAuth.register({ kind: 'fingerprint' });
                if (result.ok && result.credential) {
                    assignFn(result.credential.credentialId);
                    btn.classList.add('scanned');
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Fingerprint Scanned';
                    status.textContent = result.simulated ? '✔ Simulated scan stored' : '✔ Fingerprint stored';
                    status.style.color = '#166534';
                } else {
                    throw new Error(result.error || 'Scan failed');
                }
            } catch (err) {
                btn.disabled = false;
                status.textContent = '❌ Scan failed — try again';
                status.style.color = '#991b1b';
            }
        }

        function resetScan(btnId, statusId) {
            const btn = document.getElementById(btnId);
            const status = document.getElementById(statusId);
            btn.classList.remove('scanned');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-fingerprint"></i> Scan Fingerprint';
            status.textContent = 'Not scanned';
            status.style.color = 'var(--text-light)';
        }

        document.getElementById('pScanBtn').addEventListener('click', () =>
            scanFingerprint('pScanBtn', 'pScanStatus', id => { pCredentialId = id; }));
        document.getElementById('dScanBtn').addEventListener('click', () =>
            scanFingerprint('dScanBtn', 'dScanStatus', id => { dCredentialId = id; }));

        /* ---------- Register patient ---------- */
        document.getElementById('patientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('patientMsg');
            if (!pCredentialId) {
                showMsg(msg, '❌ Please scan the patient\'s fingerprint first', false);
                return;
            }
            const body = {
                nationalId:  document.getElementById('pNationalId').value.trim(),
                password:    document.getElementById('pPassword').value,
                fullName:    document.getElementById('pFullName').value.trim(),
                email:       document.getElementById('pEmail').value.trim(),
                phone:       document.getElementById('pPhone').value.trim(),
                bloodType:   document.getElementById('pBloodType').value,
                dateOfBirth: document.getElementById('pDOB').value,
                address:     document.getElementById('pAddress').value.trim(),
                credentialId: pCredentialId
            };
            try {
                const res = await fetch(API + '/api/admin/register-patient', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg(msg, '✅ ' + data.message, true);
                    e.target.reset();
                    pCredentialId = null;
                    resetScan('pScanBtn', 'pScanStatus');
                } else showMsg(msg, '❌ ' + (data.error || 'Failed'), false);
            } catch (err) { showMsg(msg, '❌ Server unreachable', false); }
        });

        /* ---------- Register doctor ---------- */
        document.getElementById('doctorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('doctorMsg');
            if (!dCredentialId) {
                showMsg(msg, '❌ Please scan the doctor\'s fingerprint first', false);
                return;
            }
            const body = {
                nationalId:     document.getElementById('dNationalId').value.trim(),
                password:       document.getElementById('dPassword').value,
                fullName:       document.getElementById('dFullName').value.trim(),
                specialization: document.getElementById('dSpec').value.trim(),
                hospital:       document.getElementById('dHospital').value.trim(),
                email:          document.getElementById('dEmail').value.trim(),
                credentialId:   dCredentialId
            };
            try {
                const res = await fetch(API + '/api/admin/register-doctor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg(msg, '✅ ' + data.message, true);
                    e.target.reset();
                    dCredentialId = null;
                    resetScan('dScanBtn', 'dScanStatus');
                } else showMsg(msg, '❌ ' + (data.error || 'Failed'), false);
            } catch (err) { showMsg(msg, '❌ Server unreachable', false); }
        });

        /* ---------- Load lists ---------- */
        async function loadLists() {
            const pDiv = document.getElementById('patientsList');
            const dDiv = document.getElementById('doctorsList');
            try {
                const [pr, dr] = await Promise.all([
                    fetch(API + '/api/admin/patients'),
                    fetch(API + '/api/admin/doctors')
                ]);
                const patients = await pr.json();
                const doctors  = await dr.json();

                pDiv.innerHTML = patients.length
                    ? patients.map(p => `<div class="list-item"><div><strong>${escapeHtml(p.fullName)}</strong> <small>— ${escapeHtml(p.nationalId)}</small></div><small>${escapeHtml(p.bloodType || '')} ${escapeHtml(p.email || '')}</small></div>`).join('')
                    : '<small style="color:var(--text-light);">No patients yet.</small>';

                dDiv.innerHTML = doctors.length
                    ? doctors.map(d => `<div class="list-item"><div><strong>${escapeHtml(d.fullName)}</strong> <small>— ${escapeHtml(d.specialization || 'Doctor')}</small></div><small>${escapeHtml(d.hospital || '')}</small></div>`).join('')
                    : '<small style="color:var(--text-light);">No doctors yet.</small>';
            } catch (err) {
                pDiv.innerHTML = dDiv.innerHTML = '<small style="color:#991b1b;">Could not load data.</small>';
            }
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
    </script>
</body>
</html>
